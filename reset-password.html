<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUFT | Set password</title><script src="https://browser.sentry-cdn.com/8.34.0/bundle.tracing.min.js" crossorigin="anonymous"></script><script src="app-config.js"></script><script src="sentry-init.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Segoe UI,Arial;background:#f3f5f9;display:grid;place-items:center;min-height:100vh;color:#182235}.card{background:white;padding:28px;border-radius:14px;width:min(400px,90vw)}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd4e0;border-radius:8px}button{margin-top:18px;padding:12px;width:100%;background:#a94f31;color:white;border:0;border-radius:8px;font-weight:700}.msg{color:#b42318}</style></head><body><main class="card"><h1>Set your HUFT password</h1><p>Choose a strong password for your store account.</p><form id="passwordForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required><div class="msg" id="message"></div><button>Save password</button></form></main><script>
const cfg = Object.assign({
  supabaseUrl: 'https://wyqksfncdlwjduyispmb.supabase.co',
  supabasePublishableKey: 'sb_publishable_aWp9LDntXl0nRVMS3laNJQ_ycDrJK7Z'
}, window.HUFT_CONFIG || {});
const client = (window.supabase && typeof window.supabase.createClient === 'function') 
  ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey) 
  : null;
document.getElementById('passwordForm').onsubmit=async event=>{event.preventDefault();const first=document.getElementById('newPassword'),confirm=document.getElementById('confirmPassword'),message=document.getElementById('message');if(first.value!==confirm.value){message.textContent='Passwords do not match.';return}const {error}=await client.auth.updateUser({password:first.value});if(error){message.textContent='This link is invalid or expired. Ask your administrator for a new reset.';return}message.style.color='#067647';message.textContent='Password saved. You can now sign in.';setTimeout(()=>location.href='index.html',1800)};
</script></body></html>
