const cfg = Object.assign({
  supabaseUrl: 'https://wyqksfncdlwjduyispmb.supabase.co',
  supabasePublishableKey: 'sb_publishable_aWp9LDntXl0nRVMS3laNJQ_ycDrJK7Z'
